name: Github Metrics

on:
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

  # Scheduled daily update at 01:00 UTC (08:00 WIB)
  schedule:
    - cron: "0 1 * * *"

  # Trigger on pushes to default branches
  push:
    branches:
      - master

# Prevent concurrent runs from conflicting when committing metrics SVG
concurrency:
  group: github-metrics-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege: contents write is needed to commit the generated metrics SVG
permissions:
  contents: write

jobs:
  github-metrics:
    name: Generate and Update GitHub Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate main metrics
        # uses: lowlighter/metrics@latest
        uses: stalomeow/metrics@projects-v2
        with:
          debug: yes
          plugins_errors_fatal: no
          filename: github-metrics.*
          # Prioritize METRICS_TOKEN / PAT_TOKEN (Personal Access Token), fallback to built-in GITHUB_TOKEN
          token: ${{ secrets.METRICS_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update ${filename}"
          base: activity, community, repositories, metadata
          base_skip: header
          plugin_introduction: no
          plugin_introduction_title: yes
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          plugin_wakatime: yes
          plugin_wakatime_sections: time, languages, editors, os
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 30
          plugin_topics: yes
          plugin_topics_limit: 30
          plugin_topics_mode: mastered
          plugin_achievements: yes
          plugin_achievements_threshold: C
          # plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 6
          plugin_calendar: yes
          plugin_calendar_limit: 3
          config_order: introduction, base.activity+community, base.repositories, lines, wakatime, topics, achievements, calendar
